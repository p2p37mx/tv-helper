name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: |
          set -o pipefail
          gradle --no-daemon :tv:assembleDebug :phone:assembleDebug 2>&1 | tee build.log

      - name: Save build log
        if: failure()
        run: |
          grep -v "^> Task" build.log | tail -150 > ci-log.txt
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-log
          git rm -rfq --cached .
          git add -f ci-log.txt
          git commit -qm "build log"
          git push -f origin ci-log

      - name: Rename APKs
        run: |
          mkdir out
          cp tv/build/outputs/apk/debug/tv-debug.apk out/tv.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk out/phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "نسخة ${{ github.run_number }}"
          make_latest: true
          body: |
            - tv.apk  ← ينصب على الشاشة
            - phone.apk ← ينصب على التلفون
          files: out/*.apk
